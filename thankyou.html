<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Amit Kumar</title>
    <!-- Google Font -->
    <link rel="icon" href="https://uploads.onecompiler.io/437pmbpya/1784997619776/Amit_Img%5B1%5D.jpg" style="border-radius: 50%" size="32*32" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
            overflow:hidden;
        }
        .container{
            width:90%;
            max-width:650px;
            background:#fff;
            padding:50px;
            border-radius:25px;
            text-align:center;
            box-shadow:0 25px 60px rgba(0,0,0,.25);
            animation:fadeUp .8s ease;
        }
        .success-icon{
            width:110px;
            height:110px;
            margin:auto;
            border-radius:50%;
            background:#22c55e;
            display:flex;
            justify-content:center;
            align-items:center;
            color:#fff;
            font-size:55px;
            animation:pop .6s ease;
        }
        h1{
            margin-top:25px;
            color:#0f172a;
            font-size:2.3rem;
        }
        p{
            margin-top:18px;
            color:#555;
            line-height:1.8;
            font-size:16px;
        }
        .divider{
            width:80px;
            height:4px;
            background:#2563eb;
            margin:25px auto;
            border-radius:20px;
        }
        .buttons{
            margin-top:35px;
            display:flex;
            justify-content:center;
            gap:18px;
            flex-wrap:wrap;
        }
        .btn{
            text-decoration:none;
            padding:14px 28px;
            border-radius:50px;
            font-weight:600;
            transition:.3s;
        }
        .primary{
            background:#2563eb;
            color:#fff;
        }
        .primary:hover{
            background:#1d4ed8;
            transform:translateY(-3px);
        }
        .secondary{
            border:2px solid #2563eb;
            color:#2563eb;
        }
        .secondary:hover{
            background:#2563eb;
            color:#fff;
        }
        .socials{
            margin-top:40px;
            display:flex;
            justify-content:center;
            gap:18px;
        }
        .socials a{
            width:48px;
            height:48px;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f4f4f4;
            color:#2563eb;
            font-size:20px;
            transition:.3s;
            text-decoration:none;
        }
        .socials a:hover{
            background:#2563eb;
            color:#fff;
            transform:translateY(-5px);
        }
        footer{
            margin-top:35px;
            color:#777;
            font-size:14px;
        }
        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(40px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }
        @keyframes pop{
            0%{
                transform:scale(0);
            }
            70%{
                transform:scale(1.15);
            }
            100%{
                transform:scale(1);
            }
        }
        @media(max-width:600px){
            .container{
                padding:35px 25px;
            }

            h1{
                font-size:1.8rem;
            }

            .buttons{
                flex-direction:column;
            }

            .btn{
                width:100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Thank You!</h1>
        <div class="divider"></div>
        <p>
            Your message has been received successfully.
            Thank you for taking the time to reach out.
            I truly appreciate your interest in my work and will respond to your
            message as soon as possible.
        </p>
        <div class="buttons">
            <a href="#" class="btn primary" onclick="goToPage(event)"> <!-- Link will bw added by JavaScript -->
                <i class="fas fa-home"></i> Back to Portfolio
            </a>

            <a href="index.html#contact" class="btn secondary">
                <i class="fas fa-paper-plane"></i> Send Another Message
            </a>
        </div>
        <!-- Social Links -->
        <div class="socials">
            <a href="https://www.researchgate.net/profile/Amit-Kumar-1039" target="_blank"><i class="fab fa-researchgate"></i></a>
            <a href="https://scholar.google.com/citations?user=viy7zPkAAAAJ&hl=en" target="_blank" class="profile-btn"><i class="fas fa-graduation-cap"></i></a>
            <a href="https://github.com/CsWithAk" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://www.linkedin.com/in/cswithak/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://www.youtube.com/@CsWithAk"><i class="fab fa-youtube"></i></a>
            <a href="https://x.com/CsWithAk"><i class="fab fa-twitter"></i></a>
            <a href="https://www.instagram.com/cswithak"><i class="fab fa-instagram"></i></a>
            <a href="https://facebook.com/cswithak"><i class="fab fa-facebook"></i></a>
            <a href="mailto:amitkumarmjl22@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>
        <!-- footer section -->
        <footer>
            © 2026 Amit Kumar | All Rights Reserved | CsWithAk
        </footer>
    </div>
    <!-- button JavaScript for two web pages-->
    <script>
    async function goToPage(event) {
        event.preventDefault();

        const firstLink = "index.html";
        const secondLink = "https://cswithak.github.io/portfolio/";

        try {
            const response = await fetch(firstLink, { method: "HEAD" });

            if (response.ok) {
                window.location.href = firstLink;
            } else {
                window.location.href = secondLink;
            }
        } catch (error) {
            window.location.href = secondLink;
        }
    }
    </script>
</body>
</html>
